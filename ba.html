<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Briatti Data Flow Animation</title>
<style>
  :root {
    --cream: #FAF9F6;
    --black: #111111;
    --sand: #E6E1D8;
    --blue: #1F4E79;
    --teal: #164E4A;
    --white: #fdfdfd;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--cream);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .briatti-flow {
    width: min(1400px, 100vw);
    aspect-ratio: 21 / 9;
    display: block;
    background: radial-gradient(circle at 50% 50%, rgba(230,225,216,.35), rgba(250,249,246,0) 32%), var(--cream);
  }

  text {
    fill: var(--black);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  .icon-stroke { fill: none; stroke: var(--black); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .blue-stroke { stroke: var(--blue); }
  .teal-stroke { stroke: var(--teal); }
  .white-stroke { stroke: var(--white); }
  .sand-stroke { stroke: var(--sand); }
  .sand-fill { fill: var(--sand); }
  .blue-fill { fill: var(--blue); }
  .teal-fill { fill: var(--teal); }

  .logo-wrap {
    opacity: 0;
    animation: logoIn 9s ease-in-out infinite;
    transform-origin: 700px 300px;
  }

  .logo-pulse {
    fill: none;
    stroke: var(--sand);
    stroke-width: 1.2;
    opacity: 0;
    transform-origin: 700px 300px;
    animation: pulse 9s ease-in-out infinite;
  }

  .halo {
    fill: none;
    stroke: var(--sand);
    stroke-width: 1.1;
    opacity: .9;
  }

  .halo-dash {
    stroke-dasharray: 3 12;
    animation: rotateDash 9s linear infinite;
    transform-origin: 700px 300px;
  }

  .input-card {
    opacity: 0;
    transform: translateX(-18px);
    animation: inputAppear 9s ease-in-out infinite;
  }
  .input-card:nth-of-type(1) { animation-delay: .00s; }
  .input-card:nth-of-type(2) { animation-delay: .08s; }
  .input-card:nth-of-type(3) { animation-delay: .16s; }
  .input-card:nth-of-type(4) { animation-delay: .24s; }

  .output-card {
    opacity: 0;
    transform: translateX(18px);
    animation: outputAppear 9s ease-in-out infinite;
  }

  .flow-path {
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 520;
    stroke-dashoffset: 520;
  }
  .input-path { animation: drawInput 9s cubic-bezier(.4,0,.2,1) infinite; }
  .output-path { animation: drawOutput 9s cubic-bezier(.4,0,.2,1) infinite; }

  .particle {
    opacity: 0;
    animation: particleOpacity 9s ease-in-out infinite;
  }
  .particle.output { animation-name: particleOpacityOut; }

  .node {
    opacity: 0;
    animation: nodePop 9s ease-in-out infinite;
  }

  @keyframes inputAppear {
    0%, 5% { opacity: 0; transform: translateX(-18px); }
    12%, 92% { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; transform: translateX(-10px); }
  }

  @keyframes logoIn {
    0%, 8% { opacity: 0; transform: scale(.94); }
    14%, 100% { opacity: 1; transform: scale(1); }
  }

  @keyframes drawInput {
    0%, 14% { stroke-dashoffset: 520; opacity: 0; }
    24%, 45% { stroke-dashoffset: 0; opacity: 1; }
    88% { stroke-dashoffset: 0; opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }

  @keyframes pulse {
    0%, 28% { opacity: 0; transform: scale(.82); }
    36% { opacity: .8; transform: scale(1); }
    48% { opacity: .18; transform: scale(1.18); }
    100% { opacity: .15; transform: scale(1.08); }
  }

  @keyframes drawOutput {
    0%, 45% { stroke-dashoffset: 520; opacity: 0; }
    55%, 78% { stroke-dashoffset: 0; opacity: 1; }
    91% { stroke-dashoffset: 0; opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }

  @keyframes outputAppear {
    0%, 58% { opacity: 0; transform: translateX(18px); }
    68%, 92% { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; transform: translateX(10px); }
  }

  @keyframes particleOpacity {
    0%, 14% { opacity: 0; }
    22%, 48% { opacity: .95; }
    58%, 100% { opacity: 0; }
  }

  @keyframes particleOpacityOut {
    0%, 46% { opacity: 0; }
    54%, 82% { opacity: .95; }
    94%, 100% { opacity: 0; }
  }

  @keyframes nodePop {
    0%, 9% { opacity: 0; transform: scale(.4); }
    15%, 90% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(.6); }
  }

  @keyframes rotateDash {
    to { stroke-dashoffset: -120; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-wrap, .logo-pulse, .halo-dash, .input-card, .output-card, .flow-path, .particle, .node { animation: none !important; opacity: 1; transform: none; stroke-dashoffset: 0; }
  }
</style>
