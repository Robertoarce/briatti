<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found | Briatti</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #11181D; --ink-2: #4A5259; --paper: #FBFBFA;
      --line: #E3E5E2; --cobalt: #1F4E79; --cobalt-deep: #16395A;
      --r: 6px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--paper); color: var(--ink);
      line-height: 1.65; min-height: 100dvh;
      display: flex; flex-direction: column;
    }
    .wrap { flex: 1; display: flex; align-items: center; }
    .container { width: 100%; max-width: 680px; margin: 0 auto; padding: 0 24px; }
    .mark { width: 44px; height: 44px; border-radius: var(--r); background: #F4F5F3;
            display: flex; align-items: center; justify-content: center; margin-bottom: 34px; }
    .code { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
            color: var(--ink-2); margin-bottom: 14px; }
    h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 600; letter-spacing: -.02em;
         line-height: 1.15; margin-bottom: 16px; }
    p { font-size: 16px; color: var(--ink-2); max-width: 46ch; margin-bottom: 30px; }
    a.btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 26px;
            background: var(--cobalt); color: #fff; border-radius: var(--r);
            font-size: 15px; font-weight: 600; text-decoration: none; }
    a.btn:hover { background: var(--cobalt-deep); }
    footer { border-top: 1px solid var(--line); padding: 22px 0; }
    footer .container { font-size: 13px; color: var(--ink-2); }
    :focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="container">
      <div class="mark" aria-hidden="true">
        <img src="img/favicon.svg" width="26" height="26" alt="" loading="lazy">
      </div>
      <div class="code">Error 404</div>
      <h1>That page isn't here.</h1>
      <p>The link may be old, or the address may have a typo. Everything we publish is reachable from the home page.</p>
      <a href="/" class="btn">Back to Briatti</a>
    </div>
  </div>
  <footer>
    <div class="container">&copy; 2026 Briatti</div>
  </footer>
</body>
</html>
